# Supabase local development config.
# Run `supabase start` to spin up a local stack, or link to a hosted project
# with `supabase link --project-ref <ref>`. Migrations (build step 2) will live
# in supabase/migrations; Edge Functions (step 3+) in supabase/functions.

project_id = "quizflow"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

# Google OAuth (spec §3): the only provider in this version. For local dev,
# export GOOGLE_CLIENT_ID / GOOGLE_SECRET (see .env.example notes) before
# `supabase start`. For the hosted project, configure these under
# Authentication > Providers > Google in the dashboard.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
redirect_uri = ""
